name: vision-tag
on:
  workflow_dispatch:
    inputs:
      limit: {description: "max clips this run", default: "2000"}
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Tag clips
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          VISION_LIMIT: ${{ inputs.limit }}
          VISION_MINUTES: "300"
        run: python3 pipeline/vision_tag.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "rotation-bot"; git config user.email "rotation-bot@users.noreply.github.com"
          git add vision/vision.json && git commit -m "vision tags" && git pull --rebase && git push || echo "nothing to commit"
